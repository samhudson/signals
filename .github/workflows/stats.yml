# Weekly download counts, kept in the repo's "stats" branch as one JSON line a
# week. Release downloads are kept by GitHub forever; views and clones only for
# 14 days, so the snapshot keeps them. Run by hand any time.
name: Download stats

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # append to the stats branch

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Count downloads
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNALS_REPO: ${{ github.repository }}
        run: |
          script/downloads --json > "$RUNNER_TEMP/now.json"
          jq -r '"\(.total_installs) installs from final releases"' "$RUNNER_TEMP/now.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Append to the stats branch
        run: |
          if git fetch -q origin stats 2>/dev/null; then git checkout -q stats; else git checkout -q --orphan stats; fi
          git rm -rq --cached . 2>/dev/null || true
          cat "$RUNNER_TEMP/now.json" >> downloads.jsonl
          git add downloads.jsonl
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "stats: $(date -u +%Y-%m-%d)"
          git push -q origin stats
