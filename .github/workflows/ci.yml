# Tests every push to main and every pull request, on macOS.
# Read-only and no secrets, so pull requests from forks are safe to run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests
        run: ./test/run.sh
      - name: Build the menu bar app (as brew install does)
        run: script/build-app "$RUNNER_TEMP/app"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Session tests against the Go engine
        run: ./test/core.sh
      - name: Linux and Windows downloads build
        run: |
          script/build-platforms v0.0.0-ci "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"

  # The cross-platform engine (core/) on every platform Signals will support.
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Go
        run: go version
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build -o signals-core-${{ runner.os }} ./cmd/signals-core
